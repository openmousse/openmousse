[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmousse-tree"
version = "0.2.0"
description = "OpenMousse 世界树：一份自托管的个人记忆，Claude / ChatGPT / Gemini / Notion 和你的 OpenClaw 都接到同一棵树上；存 SQLite 或一个 Markdown 文件夹（可放进 Obsidian 库）"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.23,<2",  # 2.x renamed FastMCP and changed the server API; migrate before lifting this
  "starlette>=0.40",
  "uvicorn>=0.30",
  "pyyaml>=6",     # Markdown storage reads note properties (front matter)
]

[project.scripts]
mousse-tree = "openmousse_tree.cli:main"

[tool.setuptools]
packages = ["openmousse_tree"]

[tool.setuptools.package-data]
openmousse_tree = ["ui.html"]
