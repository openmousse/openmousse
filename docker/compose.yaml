# OpenMousse with Docker Compose (docs/docker.md). From the repository root:
#   docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml logs openmousse     # first start: the pairing link (or how to get one)
name: openmousse
services:
  openmousse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: openmousse:local
    restart: unless-stopped
    ports:
      # This machine only. Phones and other computers come in through the host's Tailscale (tailscale serve --bg 8080).
      - "127.0.0.1:${MOUSSE_PORT:-8080}:8080"
    environment:
      # Read on the first start only (when the volume has no server.json yet)
      MOUSSE_NAME: ${MOUSSE_NAME:-}
      MOUSSE_LANG: ${MOUSSE_LANG:-}
      MOUSSE_TZ: ${MOUSSE_TZ:-}
      MOUSSE_PUBLIC_URL: ${MOUSSE_PUBLIC_URL:-}
    volumes:
      - openmousse-data:/data
      # To move over from OpenClaw or Hermes (mousse migrate), mount their home read only, for example:
      # - ${HOME}/.openclaw:/migrate/openclaw:ro
      # - ${HOME}/.hermes:/migrate/hermes:ro
volumes:
  openmousse-data:
